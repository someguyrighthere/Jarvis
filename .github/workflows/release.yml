name: Build JARVIS installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set app version from release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          if ($version -notmatch '^\d+(\.\d+){1,3}$') { throw "Release tag must be vMAJOR.MINOR.PATCH (optionally with a fourth numeric component)." }
          $versionSource = Get-Content .\version.py -Raw
          $versionSource = $versionSource -replace 'APP_VERSION = "[^"]+"', "APP_VERSION = `"$version`""
          Set-Content -Path .\version.py -Value $versionSource -Encoding utf8
          $installer = Get-Content .\installer.iss -Raw
          $installer = $installer -replace '#define AppVersion "[^"]+"', "#define AppVersion `"$version`""
          Set-Content -Path .\installer.iss -Value $installer -NoNewline -Encoding utf8

      - name: Set up Node for bundled avatar assets
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate release
        shell: pwsh
        run: |
          & "${{ steps.setup-python.outputs.python-path }}" -m pip install -r .\requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "Dependency installation failed." }
          npm.cmd --prefix .\avatar_web ci
          if ($LASTEXITCODE -ne 0) { throw "Renderer dependency installation failed." }
          & "${{ steps.setup-python.outputs.python-path }}" -B -m unittest test_app_updates test_avatar_bridge test_dependency_setup test_initial_setup test_speech_gestures test_speech_formatting
          if ($LASTEXITCODE -ne 0) { throw "Python release tests failed." }
          node --test .\avatar_web\speech_motion.test.mjs .\avatar_web\dependencies.test.mjs .\avatar_web\updates.test.mjs
          if ($LASTEXITCODE -ne 0) { throw "Avatar release tests failed." }

      - name: Build packaged app
        shell: pwsh
        run: .\build.ps1 -PythonExecutable "${{ steps.setup-python.outputs.python-path }}"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" .\installer.iss'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-installer
          path: dist/installer/*.exe

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/*.exe
          generate_release_notes: true
