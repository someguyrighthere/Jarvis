name: Build JARVIS installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set app version from release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          if ($version -notmatch '^\d+(\.\d+){1,3}$') { throw "Release tag must be vMAJOR.MINOR.PATCH (optionally with a fourth numeric component)." }
          $versionSource = Get-Content .\version.py -Raw
          $versionSource = $versionSource -replace 'APP_VERSION = "[^"]+"', "APP_VERSION = `"$version`""
          Set-Content -Path .\version.py -Value $versionSource -Encoding utf8
          $installer = Get-Content .\installer.iss -Raw
          $installer = $installer -replace '#define AppVersion "[^"]+"', "#define AppVersion `"$version`""
          Set-Content -Path .\installer.iss -Value $installer -NoNewline -Encoding utf8

      - name: Build packaged app
        shell: pwsh
        run: .\build.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" .\installer.iss'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-installer
          path: dist/installer/*.exe

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/*.exe
          generate_release_notes: true
